# Demo profile for the stock binary. It uses the fake provider, which serves
# fixture tickets from memory.

[provider]
kind = "fake"
# The comment box offers these kinds of comment, and starts on the first.
comment_kinds = ["public", "internal"]

[[queue]]
name = "Unassigned"
query = "status=Open and assignee="
columns = ["key", "title", "type", "priority", "created"]

[[queue]]
name = "Recent"
# The tickets you changed the status, labels or assignee of, or that were
# assigned to you or taken from you, the latest first, 20 to a page.
recent = true

[[queue]]
name = "In progress"
query = "status=In progress"
columns = ["key", "title", "assignee", "priority", "labels", "updated"]

[[queue]]
name = "Everything"
query = ""
# An overview, so "tq order" leaves it out of the working order.
order = false
columns = ["key", "title", "status", "assignee", "priority", "labels", "updated"]

[[queue]]
name = "Board"
query = ""
layout = "board"
group_by = "status"
lanes = ["Open", "In progress", "Waiting", "Done"]
card = ["key", "title", "assignee", "priority"]

[ticket]
main = ["title", "body"]
sidebar = ["status", "type", "assignee", "priority", "labels", "created", "updated"]
comments = true
pictures = true

[fields.labels]
type = "list"
label = "Labels"
